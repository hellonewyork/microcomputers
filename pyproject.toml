[project]
name = "videogen"
version = "0.1.0"
description = "Minimal 5-second text-to-video test (dry-run by default)"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=1.0",
    "replicate>=1.0",
    "google-genai>=3.0",
]

[project.optional-dependencies]
# Free, offline CPU generation (`--provider local`).
local = [
    "torch>=2.4",
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
    "safetensors>=0.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
